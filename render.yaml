services:
  - type: web
    name: site-otz
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: DATABASE_URL
        fromDatabase:
          name: site-otz-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SQLITE_DB_PATH
        value: /var/data/database.db
      - key: CORS_ORIGINS
        value: https://site-otz.onrender.com
    disk:
      name: site-otz-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: site-otz-db
    plan: free
    ipAllowList: []
