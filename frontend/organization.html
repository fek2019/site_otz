<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Организация — Народный рейтинг</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6C63FF; --primary-light: #EAE8FF; --primary-dark: #5A52D5;
      --accent: #FF6584; --accent2: #43D9AD; --gold: #FFB800;
      --bg: #F7F8FC; --surface: #fff; --text: #1A1A2E; --text-muted: #7B7F9E;
      --border: #EAECF4; --shadow-sm: 0 2px 8px rgba(108,99,255,.08);
      --shadow-lg: 0 20px 60px rgba(108,99,255,.18); --radius: 16px;
      --transition: .28s cubic-bezier(.4,0,.2,1);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(108,99,255,.10) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 80% 110%, rgba(255,101,132,.08) 0%, transparent 60%); }

    /* Header */
    header { background: rgba(255,255,255,.85); backdrop-filter: blur(20px);
             border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .header-inner { max-width: 900px; margin: 0 auto; padding: 0 24px; height: 68px;
                    display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--accent));
                 border-radius: 10px; display: flex; align-items: center; justify-content: center;
                 color: #fff; font-size: 16px; }
    .logo-text { font-size: 17px; font-weight: 800;
                 background: linear-gradient(135deg, var(--primary), var(--accent));
                 -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { display: flex; align-items: center; gap: 12px; }
    .nav-link { height: 38px; padding: 0 18px; border: 2px solid var(--border); border-radius: 99px;
                background: none; font-family: inherit; font-size: 13px; font-weight: 600;
                color: var(--text-muted); cursor: pointer; text-decoration: none;
                display: flex; align-items: center; gap: 6px; transition: all var(--transition); }
    .nav-link:hover { border-color: var(--primary); color: var(--primary); }
    .nav-link.primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark));
                        border-color: transparent; color: #fff;
                        box-shadow: 0 4px 16px rgba(108,99,255,.35); }
    .nav-link.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(108,99,255,.45); }

    /* Layout */
    .container { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; position: relative; z-index: 1; }

    /* Org hero */
    .org-hero { background: var(--surface); border-radius: var(--radius); padding: 32px;
                box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 32px;
                position: relative; overflow: hidden; }
    .org-hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
                        background: linear-gradient(90deg, var(--primary), var(--accent)); }
    .org-hero-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
    .org-icon { width: 64px; height: 64px; border-radius: 18px; background: var(--primary-light);
                display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
    .org-name { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .org-category { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
                    color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 99px; }
    .org-description { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }
    .org-rating-block { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .org-rating-num { font-size: 42px; font-weight: 900;
                      background: linear-gradient(135deg, var(--primary), var(--accent));
                      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stars      { display: flex; gap: 3px; }
    .star       { font-size: 20px; color: #D1D5E8; }
    .star.filled { color: var(--gold); }
    .reviews-count-label { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    /* Add review form */
    .review-form-card { background: var(--surface); border-radius: var(--radius); padding: 28px;
                        box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 32px; }
    .review-form-title { font-size: 18px; font-weight: 700; margin-bottom: 20px;
                         display: flex; align-items: center; gap: 8px; }
    .review-form-title i { color: var(--primary); }
    .form-group  { margin-bottom: 16px; }
    .form-label  { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
    .form-control { width: 100%; height: 46px; border: 2px solid var(--border); border-radius: 10px;
                    padding: 0 16px; font-family: inherit; font-size: 14px; color: var(--text);
                    background: var(--bg); outline: none; transition: border-color var(--transition), box-shadow var(--transition); }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,99,255,.12); background: #fff; }
    textarea.form-control { height: 110px; padding: 12px 16px; resize: vertical; line-height: 1.5; }

    /* Star picker */
    .star-picker { display: flex; gap: 6px; }
    .star-pick   { font-size: 30px; cursor: pointer; color: #D1D5E8;
                   transition: color var(--transition), transform var(--transition); user-select: none; }
    .star-pick:hover { transform: scale(1.2); }
    .star-pick.lit   { color: var(--gold); }

    .btn-submit { height: 48px; padding: 0 28px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
                  color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 15px;
                  font-weight: 700; cursor: pointer; transition: transform var(--transition), box-shadow var(--transition);
                  box-shadow: 0 6px 20px rgba(108,99,255,.35); display: flex; align-items: center; gap: 8px; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(108,99,255,.45); }

    .auth-notice { background: var(--primary-light); border-radius: 10px; padding: 16px 20px;
                   font-size: 14px; color: var(--primary); font-weight: 500; }
    .auth-notice a { color: var(--primary); font-weight: 700; }

    .error { background: #FFE5E9; color: #D63050; border-radius: 8px; padding: 10px 14px;
             font-size: 13px; font-weight: 500; margin-bottom: 14px; display: none; }
    .error.show { display: block; }

    /* Reviews list */
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px;
                     display: flex; align-items: center; gap: 10px; }
    .section-title i { color: var(--primary); }

    .review-item { background: var(--surface); border-radius: var(--radius); padding: 22px;
                   border: 1px solid var(--border); margin-bottom: 14px;
                   box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
                   animation: fadeIn .4s ease both; transition: transform var(--transition), box-shadow var(--transition); }
    .review-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .review-item::before { content: '"'; position: absolute; top: -6px; right: 14px;
                           font-size: 72px; font-family: Georgia, serif; color: var(--primary-light); line-height: 1; }
    .review-header { display: flex; align-items: center; justify-content: space-between;
                     margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .review-author-block { display: flex; align-items: center; gap: 10px; }
    .review-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex;
                     align-items: center; justify-content: center; font-size: 14px;
                     font-weight: 700; color: #fff; flex-shrink: 0; }
    .review-author { font-size: 14px; font-weight: 600; }
    .review-date   { font-size: 12px; color: var(--text-muted); }
    .review-stars  { display: flex; gap: 2px; }
    .review-star   { font-size: 15px; color: #D1D5E8; }
    .review-star.filled { color: var(--gold); }
    .review-text   { font-size: 14px; line-height: 1.6; }
    .admin-reply {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #DDE9FF;
      background: #F5F8FF;
      font-size: 13px;
      line-height: 1.55;
    }
    .admin-reply-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      color: #4A5EA8;
      margin-bottom: 6px;
    }
    .admin-reply-date {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .empty { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty i { font-size: 40px; margin-bottom: 10px; display: block; opacity: .4; }

    .photo-upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn-upload-photo { height: 46px; }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }
    .photo-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .photo-item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: #f1f3fb;
    }
    .photo-meta {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Toast */
    .toast { position: fixed; bottom: 28px; right: 28px; background: #1A1A2E; color: #fff;
             padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500;
             display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg);
             z-index: 9999; transform: translateY(80px); opacity: 0;
             transition: all .4s cubic-bezier(.4,0,.2,1); }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast i { color: var(--accent2); font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="/">
        <div class="logo-icon"><i class="fa-solid fa-star"></i></div>
        <span class="logo-text">Народный рейтинг</span>
      </a>
      <div class="nav-links" id="navLinks">
        <!-- Заполняется JS в зависимости от авторизации -->
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Карточка организации -->
    <div class="org-hero" id="orgHero">
      <div style="text-align:center;padding:40px;color:var(--text-muted)">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:32px"></i>
      </div>
    </div>

    <!-- Форма добавления отзыва / уведомление о необходимости войти -->
    <div id="reviewFormArea"></div>

    <div class="review-form-card">
      <div class="review-form-title">
        <i class="fa-solid fa-image"></i> Фотографии организации
      </div>
      <div class="error" id="photoError"></div>
      <div class="photo-upload-row">
        <input class="form-control" type="file" id="photoInput" accept="image/*" />
        <button class="btn-submit btn-upload-photo" id="btnUploadPhoto" type="button">
          <i class="fa-solid fa-upload"></i> Добавить фото
        </button>
      </div>
      <div class="photos-grid" id="photosGrid"></div>
    </div>

    <!-- Список отзывов -->
    <div class="section-title"><i class="fa-solid fa-comment-dots"></i> Все отзывы</div>
    <div id="reviewsList"></div>
  </div>

  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg"></span>
  </div>

  <script>
(() => {
  const KNOWN_CATEGORY_STICKERS = {
    'клиники': '🏥',
    'автосервисы': '🛠️',
    'салоны красоты': '💅',
    'рестораны': '🍽️',
    'магазины': '🛒',
    'другое': '🏢'
  };
  const DEFAULT_CATEGORY_STICKER = '🏢';
  const AVATAR_COLORS = ['#6C63FF', '#FF6584', '#43D9AD', '#FF9A3C', '#5B8DEF', '#A259FF'];

  const orgId = Number(window.location.pathname.split('/').pop());
  let pickedRating = 0;
  let currentUser = null;

  const els = {
    navLinks: document.getElementById('navLinks'),
    orgHero: document.getElementById('orgHero'),
    reviewFormArea: document.getElementById('reviewFormArea'),
    reviewsList: document.getElementById('reviewsList'),
    photosGrid: document.getElementById('photosGrid'),
    photoInput: document.getElementById('photoInput'),
    btnUploadPhoto: document.getElementById('btnUploadPhoto'),
    photoError: document.getElementById('photoError'),
    toast: document.getElementById('toast'),
    toastMsg: document.getElementById('toastMsg')
  };

  function getCategorySticker(category) {
    const key = (category || 'Другое').trim().toLowerCase();
    return KNOWN_CATEGORY_STICKERS[key] || DEFAULT_CATEGORY_STICKER;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  async function init() {
    els.btnUploadPhoto.addEventListener('click', uploadPhoto);
    await checkAuth();
    await loadOrganization();
  }

  async function checkAuth() {
    const res = await fetch('/api/me', { credentials: 'include' });
    const data = await res.json();
    currentUser = data.user;
    renderNav();
  }

  function renderNav() {
    if (currentUser) {
      els.navLinks.innerHTML = `
        <a class="nav-link" href="/profile">
          <i class="fa-solid fa-user"></i> ${escapeHtml(currentUser.username)}
        </a>`;
      return;
    }

    els.navLinks.innerHTML = `
      <a class="nav-link primary" href="/login">
        <i class="fa-solid fa-right-to-bracket"></i> Войти
      </a>`;
  }

  async function loadOrganization() {
    const res = await fetch(`/api/organization/${orgId}`, { credentials: 'include' });

    if (!res.ok) {
      els.orgHero.innerHTML =
        '<div style="text-align:center;padding:40px;color:#D63050">Организация не найдена</div>';
      els.reviewFormArea.innerHTML = '';
      els.reviewsList.innerHTML = '';
      els.photosGrid.innerHTML = '';
      return;
    }

    const org = await res.json();
    document.title = `${org.name} — Народный рейтинг`;

    renderOrgHero(org);
    renderPhotoGallery(org.photos || []);
    renderReviewForm(org);
    renderReviews(org.reviews || []);
  }

  function renderOrgHero(org) {
    const icon = getCategorySticker(org.category);
    const avg = Number(org.avg_rating) || 0;

    els.orgHero.innerHTML = `
      <div class="org-hero-top">
        <div class="org-icon">${icon}</div>
        <div>
          <div class="org-name">${escapeHtml(org.name)}</div>
          <div class="org-category">${icon} ${escapeHtml(org.category || 'Другое')}</div>
        </div>
      </div>
      <div class="org-description">${escapeHtml(org.description || 'Описание пока не добавлено.')}</div>
      <div class="org-rating-block">
        <div class="org-rating-num">${avg > 0 ? avg.toFixed(1) : '—'}</div>
        <div>
          <div class="stars">${starsHTML(avg, 20)}</div>
          <div class="reviews-count-label">${org.reviews_count} ${pluralReview(org.reviews_count)}</div>
        </div>
      </div>`;
  }

  function renderPhotoGallery(photos) {
    if (!photos.length) {
      els.photosGrid.innerHTML = `
        <div class="empty" style="grid-column:1 / -1">
          <i class="fa-regular fa-image"></i>
          <p>Пока нет фотографий. Добавьте первую.</p>
        </div>`;
      return;
    }

    els.photosGrid.innerHTML = photos
      .map(photo => `
        <div class="photo-item">
          <img src="${photo.image_data}" alt="Фото организации" loading="lazy" />
          <div class="photo-meta">Добавлено: ${formatDate(photo.created_at)}</div>
        </div>
      `)
      .join('');
  }

  function renderReviewForm(org) {
    if (!currentUser) {
      els.reviewFormArea.innerHTML = `
        <div class="review-form-card">
          <div class="auth-notice">
            <i class="fa-solid fa-lock"></i>
            Чтобы оставить отзыв, <a href="/login">войдите или зарегистрируйтесь</a>
          </div>
        </div>`;
      return;
    }

    const alreadyReviewed = (org.reviews || []).some(r => r.user_id === currentUser.id);
    if (alreadyReviewed) {
      els.reviewFormArea.innerHTML = `
        <div class="review-form-card">
          <div class="auth-notice" style="background:#DFF9F2;color:#2aaa88">
            <i class="fa-solid fa-circle-check"></i>
            Вы уже оставили отзыв об этой организации
          </div>
        </div>`;
      return;
    }

    els.reviewFormArea.innerHTML = `
      <div class="review-form-card">
        <div class="review-form-title">
          <i class="fa-solid fa-pen-to-square"></i> Оставить отзыв
        </div>
        <div class="error" id="formError"></div>
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-star"></i> Оценка</label>
          <div class="star-picker" id="starPicker">
            <span class="star-pick" data-val="1">★</span>
            <span class="star-pick" data-val="2">★</span>
            <span class="star-pick" data-val="3">★</span>
            <span class="star-pick" data-val="4">★</span>
            <span class="star-pick" data-val="5">★</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-comment"></i> Текст отзыва</label>
          <textarea class="form-control" id="reviewText" placeholder="Расскажите о своём опыте"></textarea>
        </div>
        <button class="btn-submit" id="btnSubmitReview" type="button">
          <i class="fa-solid fa-paper-plane"></i> Отправить
        </button>
      </div>`;

    document.querySelectorAll('.star-pick').forEach(star => {
      star.addEventListener('mouseover', () => highlightStars(Number(star.dataset.val)));
      star.addEventListener('mouseout', () => highlightStars(pickedRating));
      star.addEventListener('click', () => {
        pickedRating = Number(star.dataset.val);
        highlightStars(pickedRating);
      });
    });

    document.getElementById('btnSubmitReview').addEventListener('click', submitReview);
  }

  function highlightStars(value) {
    document.querySelectorAll('.star-pick').forEach(star => {
      star.classList.toggle('lit', Number(star.dataset.val) <= value);
    });
  }

  async function submitReview() {
    const err = document.getElementById('formError');
    const text = document.getElementById('reviewText').value.trim();
    err.classList.remove('show');

    if (!pickedRating) {
      err.textContent = 'Поставьте оценку';
      err.classList.add('show');
      return;
    }

    if (!text) {
      err.textContent = 'Напишите текст отзыва';
      err.classList.add('show');
      return;
    }

    const res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ organization_id: orgId, text, rating: pickedRating })
    });

    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'Не удалось добавить отзыв';
      err.classList.add('show');
      return;
    }

    showToast('Отзыв добавлен');
    pickedRating = 0;
    await loadOrganization();
  }

  async function uploadPhoto() {
    els.photoError.classList.remove('show');

    const file = els.photoInput.files[0];
    if (!file) {
      els.photoError.textContent = 'Выберите фото для загрузки';
      els.photoError.classList.add('show');
      return;
    }

    if (!file.type.startsWith('image/')) {
      els.photoError.textContent = 'Можно загружать только изображения';
      els.photoError.classList.add('show');
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      els.photoError.textContent = 'Фото слишком большое. Максимум 2 МБ';
      els.photoError.classList.add('show');
      return;
    }

    const imageData = await toDataUrl(file);
    const res = await fetch(`/api/organization/${orgId}/photo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ image_data: imageData })
    });

    const data = await res.json();
    if (!res.ok) {
      els.photoError.textContent = data.error || 'Не удалось загрузить фото';
      els.photoError.classList.add('show');
      return;
    }

    els.photoInput.value = '';
    showToast('Фото добавлено');
    await loadOrganization();
  }

  function toDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderReviews(reviews) {
    if (!reviews.length) {
      els.reviewsList.innerHTML = `
        <div class="empty">
          <i class="fa-regular fa-comment"></i>
          <p>Пока нет отзывов. Будьте первым!</p>
        </div>`;
      return;
    }

    els.reviewsList.innerHTML = reviews
      .map((review, index) => {
        const color = AVATAR_COLORS[index % AVATAR_COLORS.length];
        const initials = review.author
          .split(' ')
          .map(word => word[0])
          .join('')
          .slice(0, 2)
          .toUpperCase();

        return `
          <div class="review-item" style="animation-delay:${index * 0.06}s">
            <div class="review-header">
              <div class="review-author-block">
                <div class="review-avatar" style="background:${color}">${escapeHtml(initials)}</div>
                <div>
                  <div class="review-author">${escapeHtml(review.author)}</div>
                  <div class="review-date">${formatDate(review.created_at)}</div>
                </div>
              </div>
              <div class="review-stars">${smallStarsHTML(review.rating)}</div>
            </div>
            <div class="review-text">${escapeHtml(review.text)}</div>
            ${review.admin_reply ? `
              <div class="admin-reply">
                <div class="admin-reply-title">
                  <i class="fa-solid fa-reply"></i>
                  Ответ организации
                </div>
                <div>${escapeHtml(review.admin_reply)}</div>
                ${review.admin_reply_at ? `<div class="admin-reply-date">Обновлено: ${formatDate(review.admin_reply_at)}</div>` : ''}
              </div>
            ` : ''}
          </div>`;
      })
      .join('');
  }

  function starsHTML(rating, size = 20) {
    return Array.from({ length: 5 }, (_, i) =>
      `<span class="star ${i < Math.round(rating) ? 'filled' : ''}" style="font-size:${size}px">★</span>`
    ).join('');
  }

  function smallStarsHTML(rating) {
    return Array.from({ length: 5 }, (_, i) =>
      `<span class="review-star ${i < rating ? 'filled' : ''}">★</span>`
    ).join('');
  }

  function formatDate(raw) {
    return new Date(raw).toLocaleDateString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
  }

  function pluralReview(n) {
    const r = n % 10;
    if (n % 100 >= 11 && n % 100 <= 19) return 'отзывов';
    if (r === 1) return 'отзыв';
    if (r >= 2 && r <= 4) return 'отзыва';
    return 'отзывов';
  }

  let toastTimer;
  function showToast(message, isError = false) {
    const icon = els.toast.querySelector('i');
    els.toastMsg.textContent = message;
    icon.className = isError ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
    icon.style.color = isError ? '#FF6584' : '#43D9AD';

    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3000);
  }

  init();
})();
</script>
</body>
</html>
